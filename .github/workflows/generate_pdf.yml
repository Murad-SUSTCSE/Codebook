name: Auto-Generate Codebook PDFs

on:
  push:
    paths-ignore:
      - '**.pdf'
      - '**.tex'
      - '**.aux'
      - '**.log'
      - '**.toc'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended

      - name: Generate PDFs
        run: |
          python generate_codebook.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate color and B&W codebooks [skip ci]"
          file_pattern: "*.pdf"